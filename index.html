<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Viorthie — Learn Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#170D20;
    --surface:#221331;
    --surface2:#2C1A40;
    --pink:#FF6FB0;
    --magenta:#E0409E;
    --violet:#9B5DE5;
    --violet-deep:#6C33B8;
    --text:#FBF3FA;
    --text-dim:#C6AEDA;
    --text-faint:#9280AA;
    --shadow:0 12px 32px -8px rgba(224,64,158,.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% -6%, rgba(155,93,229,.35), transparent 42%),
      radial-gradient(circle at 88% 8%, rgba(224,64,158,.25), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Nunito Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,.display{ font-family:'Fredoka', sans-serif; }

  .bracket-deco{
    position:fixed; font-family:'JetBrains Mono',monospace; font-weight:700;
    color:rgba(255,111,176,.07); pointer-events:none; z-index:0; user-select:none;
  }
  .bracket-deco.b1{ top:6%; left:4%; font-size:120px; transform:rotate(-12deg);}
  .bracket-deco.b2{ bottom:4%; right:3%; font-size:160px; transform:rotate(9deg); color:rgba(155,93,229,.08);}

  #app{
    position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh;
    padding:20px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  @media(min-width:600px){ #app{max-width:560px;} }

  .mascot{
    width:110px; height:110px; border-radius:32px; margin-bottom:26px;
    background:linear-gradient(150deg, var(--pink), var(--violet-deep));
    display:flex; align-items:center; justify-content:center; font-size:44px;
    font-family:'JetBrains Mono',monospace; font-weight:700; color:#1a0d26;
    box-shadow:var(--shadow);
    animation:floaty 3.2s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
  }

  .brand-name{ font-size:34px; font-weight:600; letter-spacing:.3px; line-height:1.1; margin:0;}
  .brand-name span{ color:var(--pink);}
  .brand-sub{ font-size:13px; color:var(--text-faint); letter-spacing:2.5px; text-transform:uppercase; margin-top:8px;}

  .tagline{ font-size:14.5px; color:var(--text-dim); line-height:1.6; margin:22px 0 34px; max-width:340px;}

  .btn-start{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:16px 34px; border-radius:18px; border:none; cursor:pointer;
    font-family:'Nunito Sans',sans-serif; font-weight:800; font-size:15px; letter-spacing:.2px;
    background:linear-gradient(120deg,var(--pink),var(--magenta)); color:#22102D;
    box-shadow:var(--shadow); transition:transform .12s, opacity .12s;
  }
  .btn-start:active{ transform:scale(.97); }

  .footer-note{ position:absolute; bottom:22px; left:0; right:0; text-align:center; font-size:11px; color:var(--text-faint);}
</style>
</head>
<body>

<div class="bracket-deco b1">&lt;/&gt;</div>
<div class="bracket-deco b2">&lt;/&gt;</div>

<div id="app">
  <div class="mascot">&lt;/&gt;</div>
  <h1 class="brand-name">NONA <span>VIORTHIE</span></h1>
  <div class="brand-sub">Learn Coding</div>
  <p class="tagline">Belajar coding pelan-pelan, satu tag setiap saat. Yuk mulai petualangan codingmu bareng Nona Viorthie!</p>
  <button class="btn-start" onclick="window.location.href='loading.html'">Mulai ✨</button>
</div>

<div class="footer-note">Dibuat dengan 💜 untuk calon coder</div>

</body>
</html>
